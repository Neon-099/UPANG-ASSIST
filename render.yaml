services:
  - type: web
    name: upang-assist-api
    runtime: node
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: COOKIE_NAME
        value: upang_access_token
      - key: ALLOWED_EMAIL_DOMAINS
        value: phinmaed.com
      - key: FRONTEND_ORIGIN
        sync: false
